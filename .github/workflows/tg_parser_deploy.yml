name: Deploy workflow
on: 
  push:
    branches: [ main ]
  repository_dispatch:
    types: [deploy_trigger]
  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~
            if [ -d "fastAPI-microservice" ]; then
                cd fastAPI-microservice
                docker compose down
                rm -f .env
                git pull  https://${{ secrets.GH_TOKEN }}@github.com/HRAON88/fastAPI-microservice.git
            else
                git clone https://${{ secrets.GH_TOKEN }}@github.com/HRAON88/fastAPI-microservice.git
                cd fastAPI-microservice
            fi
            
            # Создание env файла
            cat > .env << 'EOF'
            API_ID=${{ secrets.API_ID }}
            API_HASH=${{ secrets.API_HASH }}
            SESSION_STRING=${{ secrets.SESSION_STRING }}
            EOF
            
            if [ ! -f ".env" ]; then
            echo "Error: .env file was not created!"
            exit 1
            fi  
            
            docker compose up -d --build
            
            
