name: Deploy workflow
on: 
  push:
    branches: [ main ]
  repository_dispatch:
    types: [deploy_trigger]
  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Сохраняем текущий UID и GID
            CURRENT_UID=$(id -u)
            CURRENT_GID=$(id -g)
            
            # Очистка и клонирование
            cd ~ && rm -rf fastAPI-microservice || true
            git clone --depth 1 https://${{ secrets.GH_TOKEN }}@github.com/HRAON88/fastAPI-microservice.git
            cd fastAPI-microservice
            
            # Создание .env файла
            cat > .env << EOF
            API_ID=${{ secrets.API_ID }}
            API_HASH=${{ secrets.API_HASH }}
            SESSION_STRING=${{ secrets.SESSION_STRING }}
            UID=$CURRENT_UID
            GID=$CURRENT_GID
            EOF
            
            # Остановка существующих контейнеров
            docker compose down || true
            
            # Сборка и запуск контейнеров
            DOCKER_BUILDKIT=1 docker compose build \
              --build-arg UID=$CURRENT_UID \
              --build-arg GID=$CURRENT_GID
            docker compose up -d
            
            # Очистка неиспользуемых образов
            docker image prune -f
