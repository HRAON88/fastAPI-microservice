name: Deploy workflow
on: 
  push:
    branches: [ main ]

  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Остановка существующих контейнеров
            cd ~/fastAPI-microservice 2>/dev/null && docker-compose down || true
            
            # Очистка и клонирование с использованием токена
            cd ~ && rm -rf fastAPI-microservice
            git clone https://${{ secrets.GH_PAT }}@github.com/HRAON88/fastAPI-microservice.git
            cd fastAPI-microservice
            
            # Verify clone was successful
            if [ ! -d "fastAPI-microservice" ]; then
              echo "Repository clone failed"
              exit 1
            fi
            
            # Navigate to project directory
            cd fastAPI-microservice
            
            # Stop existing containers if they exist
            if [ -f "docker-compose.yml" ]; then
              sudo docker compose down
            fi
            
            # Create .env file
            cat > .env << EOF
            API_ID=${{ secrets.API_ID }}
            API_HASH=${{ secrets.API_HASH }}
            SESSION_STRING=${{ secrets.SESSION_STRING }}
            EOF
            
            # Start containers
            sudo docker compose up -d --build
            
            # Clean up unused images
            sudo docker image prune -f
