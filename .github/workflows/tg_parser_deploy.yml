name: Deploy_tg_parser workflow
on: 
  push:
    branches: [ main ]
  repository_dispatch:
    types: [deploy_trigger]
  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Остановка существующих контейнеров
            cd ~/fastAPI-microservice 2>/dev/null && docker compose down || true
            
            # Очистка директории с sudo для решения проблем с правами
            cd ~
            sudo rm -rf fastAPI-microservice
            
            # Клонирование репозитория
            git clone --depth 1 https://${{ secrets.GH_TOKEN }}@github.com/HRAON88/fastAPI-microservice.git
            cd fastAPI-microservice
            
            # Создание .env файла
            cat > .env << EOF
            API_ID=${{ secrets.API_ID }}
            API_HASH=${{ secrets.API_HASH }}
            SESSION_STRING=${{ secrets.SESSION_STRING }}
            EOF
            
            # Установка прав на директорию
            sudo chown -R deploy:deploy .
            
            # Запуск контейнеров
            docker compose up -d --build
            
            # Очистка неиспользуемых образов
            docker image prune -f
